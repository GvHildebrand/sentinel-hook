<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="12" fill="#000">
<rect width="720" height="300" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect x="20" y="30" width="150" height="50" fill="#fff" stroke="#000"/><text x="30" y="50" font-weight="600" >Agent session</text><text x="30" y="68" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">Claude Code · subagents</text><rect x="230" y="30" width="170" height="50" fill="#fff" stroke="#000"/><text x="240" y="50" font-weight="600" >Sentinel hook</text><text x="240" y="68" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">PreToolUse · SessionStart</text><rect x="460" y="30" width="150" height="50" fill="#fff" stroke="#000"/><text x="470" y="50" font-weight="600" >Rules</text><text x="470" y="68" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">deterministic, 24 rule ids</text><line x1="170" y1="55" x2="230" y2="55" stroke="#000" marker-end="url(#a)"/><text x="200" y="49" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#767676">every call</text><line x1="400" y1="55" x2="460" y2="55" stroke="#000" marker-end="url(#a)"/><line x1="460" y1="70" x2="400" y2="70" stroke="#000" marker-end="url(#a)"/><text x="430" y="84" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#9E2B25">allow · ask · deny</text><rect x="230" y="120" width="170" height="50" fill="#fff" stroke="#000"/><text x="240" y="140" font-weight="600" >Ledger</text><text x="240" y="158" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">hash chain, one file per identity</text><line x1="315" y1="80" x2="315" y2="120" stroke="#000" marker-end="url(#a)"/><text x="315" y="94" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#767676">record + heartbeat</text><rect x="20" y="120" width="150" height="50" fill="#fff" stroke="#000"/><text x="30" y="140" font-weight="600" >The agent's commit</text><text x="30" y="158" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">git push</text><line x1="230" y1="145" x2="170" y2="145" stroke="#000" marker-end="url(#a)"/><rect x="20" y="210" width="150" height="50" fill="#fff" stroke="#000"/><text x="30" y="230" font-weight="600" >sentinel attest</text><text x="30" y="248" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">GitHub Actions</text><line x1="95" y1="170" x2="95" y2="210" stroke="#000" marker-end="url(#a)"/><text x="95" y="184" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#767676">on push</text><rect x="230" y="210" width="170" height="50" fill="#000" stroke="#000"/><text x="240" y="230" font-weight="600" fill="#fff">Sigstore Rekor</text><text x="240" y="248" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#fff">public transparency log</text><rect x="460" y="210" width="150" height="50" fill="#000" stroke="#000"/><text x="470" y="230" font-weight="600" fill="#fff">RFC 3161 TSA</text><text x="470" y="248" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#fff">independent authority</text><line x1="170" y1="235" x2="230" y2="235" stroke="#000" marker-end="url(#a)"/><text x="200" y="229" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#767676">sign-blob</text><line x1="400" y1="235" x2="460" y2="235" stroke="#000" marker-end="url(#a)"/><text x="430" y="229" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#767676">timestamp</text><text x="360" y="290" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#767676">Two clocks, neither owned by the operator or by Vigilia. The attestation is committed back under its own identity.</text>
</svg>
