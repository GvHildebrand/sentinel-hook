<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="12" fill="#000">
<rect width="720" height="222" fill="#fff"/>
<text x="12" y="16" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" >First day of live use — 285 decisions in one session, 2026-09-18T16:23 to 2026-09-18T22:19 UTC</text><rect x="12" y="30" width="664.2526315789473" height="16" fill="#E5E5E5"/><text x="16" y="42" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" >allow 272</text><rect x="676.2526315789473" y="30" width="26.863157894736844" height="16" fill="#B3B3B3"/><text x="680.2526315789473" y="42" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#fff">ask 11</text><rect x="703.1157894736841" y="30" width="4.88421052631579" height="16" fill="#9E2B25"/><text x="707.1157894736841" y="42" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#fff">deny 2</text><text x="12" y="66" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">Every one of the 13 non-allow decisions was judged a false positive on review:</text><rect x="12" y="76" width="138.46153846153848" height="12" fill="#9E2B25"/><text x="330" y="86" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" >6  B16.persistence-mutation  — the project's own .claude/settings.json matched a persistence pattern meant for the home directory</text><rect x="12" y="94" width="46.15384615384615" height="12" fill="#9E2B25"/><text x="330" y="104" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" >2  B01.rm-recursive-catastrophic  — a command that only quoted the dangerous string (a hook-input JSON; a heredoc writing a report)</text><rect x="12" y="112" width="23.076923076923077" height="12" fill="#9E2B25"/><text x="330" y="122" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" >1  B14.credential-read  — a command that mentioned a credential path without reading it</text><rect x="12" y="130" width="92.3076923076923" height="12" fill="#9E2B25"/><text x="330" y="140" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" >4  B10.remote-code-execution  — curl piped into node -e, a data pipeline, read as download-and-execute</text><text x="12" y="210" font-family="'Space Mono', Menlo, Consolas, monospace" font-size="10" fill="#767676">All three classes are corrected in sentinel 0.2.0; the corpus carries them as regression items N41–N54.</text>
</svg>
